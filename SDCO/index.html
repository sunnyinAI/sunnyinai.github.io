<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071a2f">
  <title>Sunny Data Center Observatory</title>
  <meta name="description" content="Source-backed intelligence on India's AI and data-centre infrastructure, policy and community evidence.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://sunnyinai.github.io/SDCO/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Sunny Data Center Observatory">
  <meta property="og:title" content="Sunny Data Center Observatory">
  <meta property="og:description" content="India's AI data-centre infrastructure, mapped with evidence.">
  <meta property="og:url" content="https://sunnyinai.github.io/SDCO/">
  <meta property="og:image" content="https://sunnyinai.github.io/SDCO/og.png">
  <meta property="og:image:width" content="1731">
  <meta property="og:image:height" content="909">
  <meta property="og:image:alt" content="Sunny Data Center Observatory — India AI infrastructure intelligence">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Sunny Data Center Observatory">
  <meta name="twitter:description" content="India's AI data-centre infrastructure, mapped with evidence.">
  <meta name="twitter:image" content="https://sunnyinai.github.io/SDCO/og.png">
  <meta name="twitter:image:alt" content="Sunny Data Center Observatory — India AI infrastructure intelligence">
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #071a2f;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #071a2f;
    }

    .observatory-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: 0;
      background: #f4f7fa;
    }

    .loading {
      position: fixed;
      z-index: 2;
      inset: 0;
      display: grid;
      place-content: center;
      gap: 12px;
      padding: 24px;
      background: #071a2f;
      color: #f4f7fa;
      text-align: center;
    }

    .loading[hidden] {
      display: none;
    }

    .loading strong {
      font-size: clamp(1.4rem, 4vw, 2.4rem);
      letter-spacing: -0.025em;
    }

    .loading span {
      color: #b8cbd6;
    }

    .loading a {
      display: none;
      width: max-content;
      margin: 8px auto 0;
      border-radius: 6px;
      padding: 11px 16px;
      background: #1d5fd1;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }

    .loading.is-slow a {
      display: inline-flex;
    }

    noscript {
      position: fixed;
      z-index: 3;
      inset: 0;
      display: grid;
      place-content: center;
      padding: 24px;
      background: #071a2f;
      color: #f4f7fa;
      text-align: center;
    }

    noscript a {
      color: #8edbe3;
    }
  </style>
</head>
<body>
  <div class="loading" id="loading" role="status" aria-live="polite">
    <strong>Sunny Data Center Observatory</strong>
    <span>Loading India&apos;s source-backed AI infrastructure observatory…</span>
    <a href="https://sunny-data-center-india.sunnygupta-niet.chatgpt.site/">Open the Observatory directly</a>
  </div>

  <iframe
    class="observatory-frame"
    id="observatory-frame"
    src="https://sunny-data-center-india.sunnygupta-niet.chatgpt.site/"
    title="Sunny Data Center Observatory"
    loading="eager"
    referrerpolicy="strict-origin-when-cross-origin"
    allow="clipboard-write"
  ></iframe>

  <noscript>
    <p>Open Sunny Data Center Observatory directly when JavaScript is unavailable: <a href="https://sunny-data-center-india.sunnygupta-niet.chatgpt.site/">continue to the Observatory</a>.</p>
  </noscript>

  <script>
    const frame = document.getElementById("observatory-frame");
    const loading = document.getElementById("loading");
    let loaded = false;

    frame.addEventListener("load", () => {
      loaded = true;
      loading.hidden = true;
    });

    window.setTimeout(() => {
      if (!loaded) loading.classList.add("is-slow");
    }, 8000);
  </script>
</body>
</html>
